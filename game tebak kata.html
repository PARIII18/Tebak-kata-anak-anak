<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Huruf & Angka - Indonesia & English</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Pengaturan Dasar & Font Ceria Anak */
        body {
            font-family: 'Fredoka', 'Nunito', sans-serif;
            background: radial-gradient(circle at 50% 35%, #FFF176 0%, #FFD600 55%, #FFB300 100%);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* Efek Judul 3D Tebal ala Poster Anak */
        .title-poster {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            color: #FFEA00;
            -webkit-text-stroke: 6px #111111;
            paint-order: stroke fill;
            text-shadow: 0 5px 0 #111111, 0 0 14px #FFFFFF, 0 0 18px #FFFFFF;
            letter-spacing: 0.5px;
        }
        @media (max-width: 640px) {
            .title-poster {
                -webkit-text-stroke: 4px #111111;
                text-shadow: 0 3px 0 #111111, 0 0 8px #FFFFFF;
            }
        }

        /* Badge Gelombang Indonesia English */
        .badge-text {
            text-shadow: 1.5px 1.5px 0 #01579B, -1px -1px 0 #01579B, 1px -1px 0 #01579B, -1px 1px 0 #01579B;
        }

        /* Tombol Menu Lingkaran */
        .menu-btn {
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
            box-shadow: 0 4px 0 rgba(0,0,0,0.22), inset 0 3px 4px rgba(255,255,255,0.55);
        }
        .menu-btn:active {
            transform: scale(0.9) translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.22);
        }
        .menu-btn-active {
            ring: 4px;
            box-shadow: 0 0 0 4px #FFEA00, 0 5px 12px rgba(0,0,0,0.35);
            transform: scale(1.06);
        }

        /* Kartu Grid Interaktif */
        .edu-card {
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s, box-shadow 0.2s;
            background: #FFFFFF;
        }
        .edu-card:hover {
            background-color: #FFFDE7;
            z-index: 10;
            box-shadow: 0 6px 14px rgba(245, 127, 23, 0.25);
        }
        .edu-card:active, .card-pop {
            transform: scale(1.08) !important;
            background-color: #FFF9C4 !important;
            z-index: 20;
            box-shadow: 0 8px 20px rgba(255, 160, 0, 0.45);
        }

        /* Animasi Jawaban Benar & Salah pada Mode Ujian */
        @keyframes correctPulse {
            0% { transform: scale(1); background-color: #FFFFFF; }
            40% { transform: scale(1.13); background-color: #B9F6CA; box-shadow: 0 0 0 4px #00C853; }
            100% { transform: scale(1); background-color: #E8F5E9; }
        }
        .card-correct {
            animation: correctPulse 0.65s ease-out;
            z-index: 25;
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); background-color: #FFCDD2; }
            40% { transform: translateX(6px); background-color: #FFCDD2; }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .card-wrong {
            animation: wrongShake 0.45s ease-in-out;
            z-index: 25;
        }

        /* Animasi Jerapah & Anak Mengintip Halus */
        @keyframes gentleSwayLeft {
            0%, 100% { transform: rotate(-1deg) translateY(0); }
            50% { transform: rotate(1.5deg) translateY(-4px); }
        }
        @keyframes gentleSwayRight {
            0%, 100% { transform: rotate(1deg) translateY(0); }
            50% { transform: rotate(-1.5deg) translateY(-4px); }
        }
        .giraffe-left { animation: gentleSwayLeft 4.5s ease-in-out infinite; transform-origin: bottom left; }
        .giraffe-right { animation: gentleSwayRight 4.8s ease-in-out infinite; transform-origin: bottom right; }

        /* Partikel Bintang Melayang saat Klik */
        .star-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            animation: flyStar 0.75s ease-out forwards;
        }
        @keyframes flyStar {
            0% { opacity: 1; transform: translate(0, 0) scale(0.5) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(180deg); }
        }
    </style>
</head>

            <div id="grid-main" class="grid grid-cols-3 sm:grid-cols-6 border-2 border-[#E0A96D] rounded-t-[18px] sm:rounded-t-[24px] overflow-hidden bg-[#E0A96D] gap-[1.5px]">

            <!-- Bagian Bawah: 10 Kartu Angka (2 Baris x 5 Kolom: 1-10) -->
            <div id="grid-numbers" class="grid grid-cols-5 border-x-2 border-b-2 border-[#E0A96D] rounded-b-[18px] sm:rounded-b-[24px] overflow-hidden bg-[#E0A96D] gap-[1.5px] mx-auto w-full sm:w-[90%]">
                <!-- Diisi otomatis oleh JavaScript -->
            </div>

        </main>

        <!-- Footer Info -->
        <footer class="w-full flex items-center justify-between mt-2 px-3 text-[11px] sm:text-xs font-bold text-amber-950/80">
            <span>🎮 Game Edukasi Anak Interaktif (ID / EN)</span>
            <span class="bg-[#FFEA00] border border-amber-500 px-2.5 py-0.5 rounded-full shadow-xs">Item No.: LWQ064</span>
        </footer>

    </div>

    <script>
        // =========================================================================
        // 1. DATABASE 40 ITEM EDUKASI (PERSIS SEPERTI GAMBAR POSTER)
        // =========================================================================
        const itemsData = [
            // BARIS 1: A - F

                        <rect x="74" y="54" width="7" height="22" fill="#FFF" stroke="#111" stroke-width="2"/>
                        <ellipse cx="56" cy="44" rx="24" ry="14" fill="#FFFFFF" stroke="#111" stroke-width="2.2"/>
                        <path d="M44,31 L44,57 M52,30 L52,58 M60,30 L60,58 M68,31 L68,57" stroke="#111" stroke-width="3.5"/>
                        <path d="M34,42 L26,20 L40,18 L44,36 Z" fill="#FFFFFF" stroke="#111" stroke-width="2.2"/>
                        <ellipse cx="26" cy="22" rx="11" ry="7" fill="#FFFFFF" stroke="#111" stroke-width="2.2" transform="rotate(-20 26 22)"/>
                        <circle cx="28" cy="20" r="2" fill="#111"/>
                      </svg>`
            },
            // 4 Kartu Warna
            {
                id: 'Merah', type: 'color', color: '#D50000',
                wordId: 'Merah', wordEn: 'Red',
                svg: `<svg viewBox="0 0 110 85" class="w-14 h-11 sm:w-18 sm:h-14">
                        <ellipse cx="55" cy="44" rx="34" ry="26" fill="#E53935" stroke="#B71C1C" stroke-width="2.5"/>
                        <ellipse cx="55" cy="44" rx="26" ry="19" fill="none" stroke="#FF8A80" stroke-width="2"/>
                        <circle cx="49" cy="40" r="3" fill="#B71C1C"/>
                        <circle cx="61" cy="40" r="3" fill="#B71C1C"/>
                        <circle cx="49" cy="48" r="3" fill="#B71C1C"/>
                        <circle cx="61" cy="48" r="3" fill="#B71C1C"/>
                      </svg>`
            },
            {
                id: 'Hitam', type: 'color', color: '#111111',
                wordId: 'Hitam', wordEn: 'Black',
                svg: `<svg viewBox="0 0 110 85" class="w-14 h-11 sm:w-18 sm:h-14">
                        <rect x="27" y="16" width="56" height="54" rx="8" fill="#1A1A1A" stroke="#000000" stroke-width="2.5"/>
                        <rect x="33" y="22" width="44" height="42" rx="5" fill="none" stroke="#616161" stroke-width="2"/>
                        <circle cx="55" cy="43" r="10" fill="#000" stroke="#424242" stroke-width="2"/>
                      </svg>`
            },
            {
                id: 'Merah Muda', type: 'color', color: '#EC407A',
                wordId: 'Merah Muda', wordEn: 'Pink',
                svg: `<svg viewBox="0 0 110 85" class="w-14 h-11 sm:w-18 sm:h-14">
                        <polygon points="55,10 67,33 93,37 74,55 79,80 55,68 31,80 36,55 17,37 43,33"
                                 fill="#FF1493" stroke="#AD1457" stroke-width="2.5" stroke-linejoin="round"/>
                        <polygon points="55,17 65,36 86,39 71,54 74,74 55,64 36,74 39,54 24,39 45,36"
                                 fill="none" stroke="#FF80AB" stroke-width="1.8"/>
                      </svg>`
            },
            {
                id: 'Biru', type: 'color', color: '#1565C0',
                wordId: 'Biru', wordEn: 'Blue',
                svg: `<svg viewBox="0 0 110 85" class="w-14 h-11 sm:w-18 sm:h-14">
                        <polygon points="55,14 94,72 16,72" fill="#1E88E5" stroke="#0D47A1" stroke-width="2.5" stroke-linejoin="round"/>
                        <polygon points="55,22 86,67 24,67" fill="none" stroke="#90CAF9" stroke-width="2"/>
                      </svg>`
            },

            // BARIS 6 & 7: 10 KARTU ANGKA (1 - 10)
            { id: '1', type: 'number', num: '1', color: '#E53935', wordId: 'Satu', wordEn: 'One' },
            { id: '2', type: 'number', num: '2', color: '#F57C00', wordId: 'Dua', wordEn: 'Two' },
            { id: '3', type: 'number', num: '3', color: '#2E7D32', wordId: 'Tiga', wordEn: 'Three' },
            { id: '4', type: 'number', num: '4', color: '#1565C0', wordId: 'Empat', wordEn: 'Four' },
            { id: '5', type: 'number', num: '5', color: '#D50000', wordId: 'Lima', wordEn: 'Five' },
            { id: '6', type: 'number', num: '6', color: '#E91E63', wordId: 'Enam', wordEn: 'Six' },
            { id: '7', type: 'number', num: '7', color: '#388E3C', wordId: 'Tujuh', wordEn: 'Seven' },
            { id: '8', type: 'number', num: '8', color: '#D32F2F', wordId: 'Delapan', wordEn: 'Eight' },
            { id: '9', type: 'number', num: '9', color: '#EF6C00', wordId: 'Sembilan', wordEn: 'Nine' },
            { id: '10', type: 'number', num: '10', color: '#00695C', wordId: 'Sepuluh', wordEn: 'Ten' }
        ];

        // =========================================================================
        // 2. STATE PERMAINAN
        // =========================================================================
        let currentLang = 'id';     // 'id' = Indonesia, 'en' = English
        let wordMode = false;       // false = baca huruf/angka saja, true = baca huruf + kata
        let quizMode = false;       // true = sedang mode Ujian
        let quizTarget = null;      // objek item target ujian saat ini
        let quizScore = 0;
        let isMusicPlaying = false;
        let musicInterval = null;
        let audioCtx = null;

        // =========================================================================
        // 3. RENDER PAPAN KARTU KE LAYAR
        // =========================================================================
        function renderBoard() {
            const gridMain = document.getElementById('grid-main');
            const gridNumbers = document.getElementById('grid-numbers');
            gridMain.innerHTML = '';
            gridNumbers.innerHTML = '';

            itemsData.forEach((item, index) => {
                const card = document.createElement('button');
                card.type = 'button';
                card.id = `card-${item.id}`;
                card.className = 'edu-card flex flex-col items-center justify-between p-1.5 sm:p-2 focus:outline-none relative overflow-hidden';
                card.onclick = (e) => handleCardClick(item, card, e);

                if (item.type === 'letter') {
                    // Kartu Huruf A-Z persis seperti gambar
                    card.innerHTML = `
                        <div class="w-full flex items-baseline justify-between px-0.5 sm:px-1">
                            <div class="font-black text-xl sm:text-2xl md:text-[28px] leading-none tracking-tight" style="color:${item.color}">
                                ${item.upper}<span class="text-base sm:text-xl md:text-2xl ml-0.5">${item.lower}</span>
                            </div>
                            <span class="font-extrabold text-[11px] sm:text-xs md:text-sm truncate ml-1" style="color:${item.color}">
                                ${item.wordId}
                            </span>
                        </div>
                        <div class="my-0.5 flex items-center justify-center">
                            ${item.svg}
                        </div>
                        <div class="font-extrabold text-[10px] sm:text-xs text-gray-900 leading-tight">
                            ${item.wordEn}
                        </div>
                    `;
                    gridMain.appendChild(card);
                } else if (item.type === 'color') {
                    // Kartu Warna (Merah, Hitam, Merah Muda, Biru)
                    card.innerHTML = `
                        <div class="w-full flex items-center justify-around px-0.5 pt-0.5">
                            <span class="font-extrabold text-[10px] sm:text-xs md:text-[13px] leading-tight" style="color:${item.color}">
                                ${item.wordId}
                            </span>
                            <span class="font-extrabold text-[10px] sm:text-xs md:text-[13px] text-gray-800 leading-tight">
                                ${item.wordEn}
                            </span>
                        </div>
                        <div class="my-auto py-0.5 flex items-center justify-center">
                            ${item.svg}
                        </div>
                    `;
                    gridMain.appendChild(card);
                } else if (item.type === 'number') {
                    // Kartu Angka 1 - 10 di 2 baris bawah
                    card.className += ' py-2 sm:py-2.5';
                    card.innerHTML = `
                        <div class="flex items-center justify-center gap-1.5 sm:gap-2.5 w-full">
                            <span class="font-black text-2xl sm:text-4xl md:text-[42px] leading-none" style="color:${item.color}">
                                ${item.num}
                            </span>
                            <div class="flex flex-col text-left leading-tight">
                                <span class="font-extrabold text-[11px] sm:text-sm md:text-base" style="color:${item.color}">
                                    ${item.wordId}
                                </span>
                                <span class="font-extrabold text-[10px] sm:text-xs md:text-sm text-gray-900">
                                    ${item.wordEn}
                                </span>
                            </div>
                        </div>
                    `;
                    gridNumbers.appendChild(card);
                }
            });
        }

        // =========================================================================
        // 4. SINTESIS SUARA NARASI (WEB SPEECH API - INDONESIA & ENGLISH)
        // =========================================================================
        function speakText(text, langCode) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode === 'id' ? 'id-ID' : 'en-US';
            utterance.rate = 0.92;  // Kecepatan ramah anak
            utterance.pitch = 1.15; // Nada sedikit ceria

            // Cari voice terbaik yang tersedia di perangkat
            const voices = window.speechSynthesis.getVoices();
            const targetPrefix = langCode === 'id' ? 'id' : 'en';
            const matchedVoice = voices.find(v => v.lang.toLowerCase().startsWith(targetPrefix));
            if (matchedVoice) {
                utterance.voice = matchedVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // Pastikan daftar voice dimuat di browser Chrome/Android
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // =========================================================================
        // 5. EFEK SUARA & MUSIK LATAR CERIA (WEB AUDIO API)
        // =========================================================================
        function initAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, duration = 0.15, type = 'sine', volume = 0.18, delay = 0) {
            try {
                initAudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);

                gain.gain.setValueAtTime(volume, audioCtx.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + delay);
                osc.stop(audioCtx.currentTime + delay + duration);
            } catch (e) {}
        }

        function playClickPop() {
            playTone(587.33, 0.08, 'triangle', 0.14); // D5
        }

        function playCorrectSound() {
            playTone(523.25, 0.14, 'triangle', 0.22, 0);    // C5
            playTone(659.25, 0.14, 'triangle', 0.22, 0.11); // E5
            playTone(783.99, 0.28, 'triangle', 0.25, 0.22); // G5
        }

        function playWrongSound() {
            playTone(246.94, 0.18, 'sawtooth', 0.12, 0);    // B3
            playTone(196.00, 0.25, 'sawtooth', 0.12, 0.15); // G3
        }

        function toggleMusic() {
            isMusicPlaying = !isMusicPlaying;
            const offLine = document.getElementById('music-off-line');
            const iconMusic = document.getElementById('icon-music');

            if (isMusicPlaying) {
                offLine.classList.add('hidden');
                iconMusic.classList.add('menu-btn-active');
                startBackgroundMelody();
            } else {
                offLine.classList.remove('hidden');
                iconMusic.classList.remove('menu-btn-active');
                stopBackgroundMelody();
            }
        }

        function startBackgroundMelody() {
            stopBackgroundMelody();
            // Melodi lagu anak ceria ("Twinkle / Bintang Kecil" variasi lembut)
            const melody = [
                261.63, 261.63, 392.00, 392.00, 440.00, 440.00, 392.00, 0,
                349.23, 349.23, 329.63, 329.63, 293.66, 293.66, 261.63, 0
            ];
            let step = 0;
            musicInterval = setInterval(() => {
                if (!isMusicPlaying) return;
                const note = melody[step % melody.length];
                if (note > 0) {
                    playTone(note, 0.32, 'sine', 0.055);
                }
                step++;
            }, 420);
        }

        function stopBackgroundMelody() {
            if (musicInterval) {
                clearInterval(musicInterval);
                musicInterval = null;
            }
        }

        // =========================================================================
        // 6. PARTIKEL BINTANG VISUAL SAAT KARTU DIKLIK
        // =========================================================================
        function spawnStars(x, y) {
            const colors = ['#FFEA00', '#FF1744', '#00E5FF', '#00E676', '#FF9100'];
            for (let i = 0; i < 6; i++) {
                const star = document.createElement('div');
                star.className = 'star-particle text-lg sm:text-xl font-bold';
                star.textContent = '★';
                star.style.color = colors[i % colors.length];
                star.style.left = `${x - 8}px`;
                star.style.top = `${y - 8}px`;

                const angle = (Math.PI * 2 * i) / 6 + (Math.random() * 0.4);
                const dist = 35 + Math.random() * 35;
                star.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
                star.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);

                document.body.appendChild(star);
                setTimeout(() => star.remove(), 750);
            }
        }

        // =========================================================================
        // 7. LOGIKA TOMBOL KONTROL ATAS (INI/EN, KATA, UJIAN)
        // =========================================================================
        function toggleLanguage() {
            playClickPop();
            currentLang = currentLang === 'id' ? 'en' : 'id';

            const badge = document.getElementById('lang-badge');
            badge.textContent = currentLang.toUpperCase();

            if (currentLang === 'id') {
                speakText('Mode Bahasa Indonesia', 'id');
            } else {
                speakText('English Mode', 'en');
            }

            if (quizMode && quizTarget) {
                setTimeout(() => askQuizQuestion(), 900);
            } else {
                updateStatusBar();
            }
        }

        function toggleWordMode() {
            playClickPop();
            if (quizMode) {
                quizMode = false;
                document.getElementById('icon-quiz').classList.remove('menu-btn-active');
            }
            wordMode = !wordMode;

            const iconWord = document.getElementById('icon-word');
            if (wordMode) {
                iconWord.classList.add('menu-btn-active');
                speakText(currentLang === 'id' ? 'Mode baca kata' : 'Word reading mode', currentLang);
            } else {
                iconWord.classList.remove('menu-btn-active');
                speakText(currentLang === 'id' ? 'Mode huruf dan angka' : 'Letters and numbers mode', currentLang);
            }
            updateStatusBar();
        }

        function toggleQuizMode() {
            playClickPop();
            quizMode = !quizMode;
            const iconQuiz = document.getElementById('icon-quiz');
            const iconWord = document.getElementById('icon-word');

            if (quizMode) {
                wordMode = false;
                iconWord.classList.remove('menu-btn-active');
                iconQuiz.classList.add('menu-btn-active');
                quizScore = 0;
                document.getElementById('quiz-score').textContent = '0';
                nextQuizQuestion();
            } else {
                iconQuiz.classList.remove('menu-btn-active');
                quizTarget = null;
                speakText(currentLang === 'id' ? 'Ujian selesai' : 'Quiz finished', currentLang);
                updateStatusBar();
            }
        }

        function updateStatusBar() {
            const modePill = document.getElementById('mode-pill');
            const statusText = document.getElementById('status-text');
            const repeatBtn = document.getElementById('btn-repeat-quiz');
            const scoreBox = document.getElementById('quiz-score-box');

            if (quizMode) {
                modePill.textContent = currentLang === 'id' ? '🎯 Mode Ujian' : '🎯 Quiz Mode';
                modePill.className = 'px-2.5 py-0.5 rounded-full font-extrabold text-white bg-[#D50000] text-xs uppercase tracking-wide shrink-0';
                repeatBtn.classList.remove('hidden');
                scoreBox.classList.remove('hidden');
                scoreBox.classList.add('flex');
            } else {
                repeatBtn.classList.add('hidden');
                scoreBox.classList.add('hidden');
                scoreBox.classList.remove('flex');

                if (wordMode) {
                    modePill.textContent = currentLang === 'id' ? '🔊 Mode Kata (ID)' : '🔊 Word Mode (EN)';
                    modePill.className = 'px-2.5 py-0.5 rounded-full font-extrabold text-white bg-[#FF6D00] text-xs uppercase tracking-wide shrink-0';
                    statusText.textContent = currentLang === 'id'
                        ? 'Klik kartu untuk mendengar huruf dan nama bendanya!'
                        : 'Tap any card to hear the letter and object name!';
                } else {
                    modePill.textContent = currentLang === 'id' ? '📘 Belajar (ID)' : '📘 Learn (EN)';
                    modePill.className = 'px-2.5 py-0.5 rounded-full font-extrabold text-white bg-[#0091EA] text-xs uppercase tracking-wide shrink-0';
                    statusText.textContent = currentLang === 'id'
                        ? 'Sentuh huruf, warna, atau angka untuk mendengarnya!'
                        : 'Tap any letter, color, or number to listen!';
                }
            }
        }

        // =========================================================================
        // 8. LOGIKA UJIAN (KUIS TEBAK KARTU)
        // =========================================================================
        function nextQuizQuestion() {
            const randomIndex = Math.floor(Math.random() * itemsData.length);
            quizTarget = itemsData[randomIndex];
            askQuizQuestion();
        }

        function askQuizQuestion() {
            if (!quizTarget) return;
            updateStatusBar();
            const statusText = document.getElementById('status-text');

            let questionText = '';
            if (currentLang === 'id') {
                if (quizTarget.type === 'letter') {
                    questionText = `Di manakah huruf ${quizTarget.upper}, ${quizTarget.wordId}?`;
                } else if (quizTarget.type === 'color') {
                    questionText = `Mana warna ${quizTarget.wordId}?`;
                } else {
                    questionText = `Di manakah angka ${quizTarget.num}, ${quizTarget.wordId}?`;
                }
            } else {
                if (quizTarget.type === 'letter') {
                    questionText = `Where is letter ${quizTarget.upper}, ${quizTarget.wordEn}?`;
                } else if (quizTarget.type === 'color') {
                    questionText = `Where is color ${quizTarget.wordEn}?`;
                } else {
                    questionText = `Where is number ${quizTarget.wordEn}?`;
                }
            }

            statusText.textContent = questionText;
            speakText(questionText, currentLang);
        }

        function repeatQuizQuestion() {
            if (quizMode && quizTarget) {
                askQuizQuestion();
            }
        }

        // =========================================================================
        // 9. INTERAKSI SAAT KARTU DIKLIK / DISENTUH
        // =========================================================================
        function handleCardClick(item, cardEl, event) {
            // Efek bintang di titik klik
            const rect = cardEl.getBoundingClientRect();
            const clickX = event.clientX || (rect.left + rect.width / 2);
            const clickY = event.clientY || (rect.top + rect.height / 2);
            spawnStars(clickX, clickY);

            // Animasi kartu membal
            cardEl.classList.remove('card-pop');
            void cardEl.offsetWidth;
            cardEl.classList.add('card-pop');
            setTimeout(() => cardEl.classList.remove('card-pop'), 260);

            // Jika sedang dalam MODE UJIAN
            if (quizMode && quizTarget) {
                if (item.id === quizTarget.id) {
                    // Jawaban Benar!
                    playCorrectSound();
                    quizScore += 10;
                    document.getElementById('quiz-score').textContent = quizScore;

                    cardEl.classList.remove('card-correct');
                    void cardEl.offsetWidth;
                    cardEl.classList.add('card-correct');

                    const praise = currentLang === 'id' ? 'Hebat! Benar sekali!' : 'Great job! Correct!';
                    document.getElementById('status-text').textContent = `🎉 ${praise}`;
                    speakText(praise, currentLang);

                    setTimeout(() => {
                        if (quizMode) nextQuizQuestion();
                    }, 1600);
                } else {
                    // Jawaban Salah
                    playWrongSound();
                    cardEl.classList.remove('card-wrong');
                    void cardEl.offsetWidth;
                    cardEl.classList.add('card-wrong');

                    const retryMsg = currentLang === 'id' ? 'Coba lagi ya!' : 'Try again!';
                    speakText(retryMsg, currentLang);
                }
                return;
            }

            // Jika dalam MODE BELAJAR (Huruf/Angka atau Kata)
            playClickPop();
            let speechPhrase = '';

            if (currentLang === 'id') {
                if (wordMode) {
                    if (item.type === 'letter') speechPhrase = `${item.upper}. ${item.wordId}`;
                    else if (item.type === 'color') speechPhrase = `Warna ${item.wordId}`;
                    else speechPhrase = `Angka ${item.wordId}`;
                } else {
                    if (item.type === 'letter') speechPhrase = item.upper;
                    else speechPhrase = item.wordId;
                }
            } else {
                if (wordMode) {
                    if (item.type === 'letter') speechPhrase = `${item.upper}. ${item.wordEn}`;
                    else if (item.type === 'color') speechPhrase = `Color ${item.wordEn}`;
                    else speechPhrase = `Number ${item.wordEn}`;
                } else {
                    if (item.type === 'letter') speechPhrase = item.upper;
                    else speechPhrase = item.wordEn;
                }
            }

            // Tampilkan teks yang sedang dibaca pada status bar
            document.getElementById('status-text').textContent = `🗣️ "${speechPhrase}"`;
            speakText(speechPhrase, currentLang);
        }

        // Inisialisasi papan saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            renderBoard();
            updateStatusBar();
        });
    </script>
